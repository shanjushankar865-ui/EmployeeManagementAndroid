name: Build Employee APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project
        run: |
          unzip -o EmployeeManagementAndroid.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/EmployeeManagementAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Employee-Management-APK
          path: extracted/EmployeeManagementAndroid/app/build/outputs/apk/debug/app-debug.apk
